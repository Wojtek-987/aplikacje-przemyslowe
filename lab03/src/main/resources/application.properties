# External API endpoint (used by ApiService later)
app.api.url=https://jsonplaceholder.typicode.com/users

# Default CSV file path used by ImportService
app.import.csv-file=classpath:employees.csv

# Logging baseline
logging.level.root=INFO

# Web layer
server.port=8080
spring.application.name=employee-management-api

# Jackson: ISO-8601 dates (not numeric timestamps)
spring.jackson.serialization.write-dates-as-timestamps=false

# === File upload configuration ===
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Directories for uploaded files and generated reports
app.upload.directory=uploads/
app.reports.directory=reports/
